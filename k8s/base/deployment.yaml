apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  # PVC в режиме RWO: новый под не поднимется, пока старый держит volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: model-downloader
          image: vllm-model-downloader:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-runtime
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp

      containers:
        - name: vllm
          image: vllm-cpu:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vllm-runtime
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-token
                  key: VLLM_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "4"
              memory: 10Gi
            limits:
              cpu: "4"
              memory: 10Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90   # до 15 минут на загрузку весов и прогрев
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: vllm-config
              mountPath: /etc/vllm/config
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: vllm-config
          configMap:
            name: vllm-config
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
