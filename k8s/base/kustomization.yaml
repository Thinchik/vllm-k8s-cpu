apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-inference

labels:
  - pairs:
      app.kubernetes.io/part-of: vllm-inference
    includeSelectors: false

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  # env-переменные для обоих контейнеров
  - name: vllm-runtime
    envs:
      - config/runtime.env
  # аргументы vllm serve
  - name: vllm-config
    files:
      - config/config.yaml
